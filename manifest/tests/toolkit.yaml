    (~/flutter-apps/demo_counter/flutter_counter_demo > /tmp/fc-default.log 2>&1 &) ; sleep 7; grim /tmp/flutter-counter-default.png; pkill -x flutter_counter;
    if grep -q "Failed to create OpenGL context" /tmp/fc-default.log; then echo "GLCONTEXT=FAIL (GTK3 cannot create a GL context with default settings)"; else echo "GLCONTEXT=OK"; fi
  timeout: 30
  requires: ['~/flutter-apps/demo_counter/flutter_counter_demo']
  collect: ['/tmp/flutter-counter-default.png', '/tmp/fc-default.log']
  pass_regex: 'GLCONTEXT=OK'
  tags: [flutter, flutter-real]
  notes: "Same app WITHOUT GDK_GL=gles (default settings). Expected to fail: GTK3 cannot create a GL context here."

