- id: toolkit.flutter-demo.animations-drive
  phase: 3
  cmd: python3 ~/gpu-test/scripts/flutter_anim_drive.py /tmp/flutter-anim-drive 6
  timeout: 400
  requires: ['~/flutter-apps/demo_animations/animations', wlrctl]
  collect: ['/tmp/flutter-anim-drive/*']
  metrics: {fps: 'FLUTTERANIM \{"sample": "\w+", "fps": ([\d.]+)', max_fps: 'max_fps=([\d.]+)'}
  pass_regex: 'app_died=0'
  tags: [flutter, flutter-real]
  notes: "Official flutter/samples 'animations' app (18 Material-motion samples), stock, cross-built on the laptop (flutter/demo_animations, flutter/build-arm64.sh APP=demo_animations), GDK_GL=gles. Driven with synthetic pointer input (wlrctl); fps = Wayland GL buffer swaps/s of the app window, so it is only meaningful for continuously animating samples (CardSwipe, FlutterAnimate, RepeatingAnimation, SpringPhysics...); one-shot transitions and static pages read low/0 by design. Checks: no GPU hang, no crash, screenshot per sample."

- id: toolkit.flutter-demo.animations-drive-verbose
  phase: 3
  cmd: VERBOSE=1 python3 ~/gpu-test/scripts/flutter_anim_drive.py /tmp/flutter-anim-drive-verbose 6
  timeout: 500
  requires: ['~/flutter-apps/demo_animations/animations', wlrctl]
  collect: ['/tmp/flutter-anim-drive-verbose/*']
  metrics: {fps: 'FLUTTERANIM \{"sample": "\w+", "fps": ([\d.]+)', max_fps: 'max_fps=([\d.]+)'}
  pass_regex: 'app_died=0'
  tags: [flutter, flutter-real, verbose-logs]
  notes: "Same as toolkit.flutter-demo.animations-drive with every log source enabled: MESA_DEBUG=1, EGL_LOG_LEVEL=debug, LIBGL_DEBUG=verbose, G_MESSAGES_DEBUG=all, GDK_DEBUG=opengl,events,misc,dnd,input,cursor,eventloop, Flutter engine switches verbose-logging/trace-startup (may be ignored by a release engine), WAYLAND_DEBUG=client. Full unfiltered stderr is kept as app-stderr-full.log.gz. Verbose logging costs frame rate, so compare fps with the non-verbose test, not with other runs."

- id: toolkit.flutter-real.renderer-matrix-verbose
  phase: 3
  cmd: VERBOSE=1 python3 ~/gpu-test/scripts/flutter_bench_matrix.py /tmp/flutter-bench-verbose
  timeout: 900
  requires: ['~/flutter-apps/gpu_bench/gpu_bench']
  collect: ['/tmp/flutter-bench-verbose/*', '/tmp/flutter-bench-verbose/logs/*']
  metrics: {fps: '-> ([\d.]+) fps', min_fps: 'min_fps=([\d.]+)', max_fps: 'max_fps=([\d.]+)'}
  pass_regex: 'failed=0'
  tags: [flutter, flutter-real, verbose-logs]
  notes: "The gpu_bench Flutter app (animated circles/gradients/shadows/blur/opacity/clip/text/images/list) with every log source on: MESA_DEBUG=1, EGL_LOG_LEVEL=debug, LIBGL_DEBUG=verbose, G_MESSAGES_DEBUG=all, GDK_DEBUG=opengl,events,misc,..., engine switches verbose-logging/trace-startup (a release engine may ignore them), WAYLAND_DEBUG=client. One gzipped full log per scene run in logs/. Tracing slows the app: use toolkit.flutter-real.renderer-matrix (rerun12) for the real fps numbers."
