  timeout: 1500
  requires: [gtk4-widget-factory]
  collect: ['/tmp/gtk4-bench/*']
  metrics: {runs: 'GTK4BENCH runs=(\d+)', gl_faster_in: 'gl_faster_in=(\d+)/', gl_vs_cairo_geomean: 'gl_vs_cairo_geomean=([\d.]+)'}
  tags: [gles3-gtk-renderer]
  notes: "7 GSK scenes x counts x {cairo(CPU), gl(GPU)}; see gtk4-bench.md in the run artifacts."
- id: toolkit.gtk4.gl-segv-repro
  phase: 2
  risk: medium
  cmd: python3 ~/gpu-test/scripts/gtk4_crash_repro.py 6 text 30
  timeout: 400
  requires: [gtk4-widget-factory]
  pass_regex: 'segv=0 '
  metrics: {runs: 'CRASHREPRO .*? runs=(\d+)', segv: 'segv=(\d+)', ok: ' ok=(\d+)', median_fps: 'median_fps=([\d.]+)'}
  tags: [gles3-gtk-renderer]
  notes: "SIGSEGV in Mesa libgallium dri_drawable_bind_images (via glClear from the GSK GL renderer): 100% with the text scene at n>=20 (rarely at n=10). A plain big window or per-frame resizing does NOT reproduce it (scripts/gtk4_size_probe.py). Test FAILS while the bug exists."
- id: toolkit.flutter-real.renderer-matrix
  phase: 2
  risk: medium
  cmd: python3 ~/gpu-test/scripts/flutter_bench_matrix.py /tmp/flutter-bench
  timeout: 1500
  requires: ['~/flutter-apps/gpu_bench/gpu_bench']
  collect: ['/tmp/flutter-bench/*']
  metrics: {runs: 'FLUTTERMATRIX runs=(\d+)', ok: ' ok=(\d+)', failed: 'failed=(\d+)', min_fps: 'min_fps=([\d.]+)', max_fps: 'max_fps=([\d.]+)'}
  tags: [gles3-flutter]
  notes: "REAL Flutter (stock SDK, GTK embedder, Impeller OpenGLES), cross-built on the laptop (flutter/build-arm64.sh). Needs GDK_GL=gles (set by the script)."
- id: toolkit.flutter-real.default-gl-context
  phase: 2
  cmd: >-
    out=$(GDK_BACKEND=wayland ~/flutter-apps/gpu_bench/gpu_bench circles 10 4 2>&1);
    if echo "$out" | grep -q "Failed to create OpenGL context"; then echo "GLCONTEXT=FAIL (GTK3 cannot create a GL context with default settings)"; else echo "GLCONTEXT=OK"; fi
  timeout: 60
  requires: ['~/flutter-apps/gpu_bench/gpu_bench']
  pass_regex: 'GLCONTEXT=OK'
  tags: [gles3-flutter]
  notes: "Without GDK_GL=gles GTK3 cannot create a GL context on this driver ('Unable to create a GL context'); the Flutter app then runs headless (reports 60 fps at the full 2560x1440 size, nothing is presented). Test FAILS while that is the default behaviour."
- id: toolkit.gtk4.manual-visual
  type: manual
  phase: 2
  steps: "Run gtk4-widget-factory and gtk4-demo (GSK_RENDERER=gl) on the device screen. Scroll lists, open dialogs, toggle dark theme, run the fishbowl demo."
  pass_criteria: "No flicker/corruption, smooth scrolling, no crash for 5 minutes."

