- id: toolkit.flutter-demo.counter-gles
  phase: 2
  cmd: >-
    (GDK_GL=gles ~/flutter-apps/demo_counter/flutter_counter_demo 2>&1 | grep -E "Impeller|rror|Failed") & sleep 7; grim /tmp/flutter-counter-gles.png; sleep 1; pkill -x flutter_counter; wait
  timeout: 30
  requires: ['~/flutter-apps/demo_counter/flutter_counter_demo']
  collect: ['/tmp/flutter-counter-gles.png']
  pass_regex: 'Impeller rendering backend'
  tags: [flutter, flutter-real]
  notes: "Stock `flutter create` counter app (flutter/demo_counter), cross-built on the laptop with flutter/build-arm64.sh APP=demo_counter. GDK_GL=gles is required (see toolkit.flutter-real.default-gl-context). Static UI: this is a does-it-render check, not a benchmark; check the screenshot."
- id: toolkit.flutter-demo.counter-default
